name: Build Abdul Basit Mujawwad audio
on:
  workflow_dispatch:
    inputs:
      folder: {description: 'everyayah.com folder', required: true, default: 'Abdul_Basit_Mujawwad_128kbps'}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: mkdir -p site && python3 scripts/build-reciter.py "${{ inputs.folder || 'Abdul_Basit_Mujawwad_128kbps' }}" mujawwad site src/data/aud_mujawwad.json
      - run: du -sh site/audio/mujawwad && ls site/audio/mujawwad | wc -l
      - name: Publish audio to gh-pages
        run: |
          cd site && touch .nojekyll && git init -q -b gh-pages && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "Audio: Abdul Basit Mujawwad" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Commit timings
        run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add src/data/aud_mujawwad.json && git commit -m "Timings: mujawwad" && git push
